# MT alteradora: suma binaria.
#   Entrada x+y con x, y ∈ {0,1}+ (por ejemplo 1011+110). Al terminar, la
#   cinta contiene solo x + y en binario (10001), sin '+', sin y y sin
#   marcadores, y el cabezal está sobre el primer símbolo del resultado.
#   El resultado conserva el ancho del operando más largo (o uno más si
#   queda un acarreo al final). Si la entrada no tiene ceros a la izquierda,
#   la salida tampoco; si los tiene, se conservan (001+1 → 010). Una entrada
#   mal formada (+1, 1+, 1++1, 11) se detiene sin aceptar.
#
# Marcadores:
#   C / U  bit 0 / 1 definitivo del resultado (columna ya sumada); puede
#          estar a la izquierda de x si y es más largo
#
# Fase 1 (q0-q3) validar: x no vacío, un solo '+', y no vacío.
# Fase 2 (q4-q9, q11) sumar: borra el último bit de y y lo lleva en el
#   estado hasta la columna del mismo peso, que es la primera celda sin
#   marcar a la izquierda de las marcas (un bit de x, un 1 dejado por un
#   acarreo o un blanco si x ya se acabó). Lo suma ahí y la marca. Si hay
#   acarreo lo propaga a la izquierda, igual que un incremento.
# Fase 3 (q10) limpiar: cuando y se acabó, borra el '+' y regresa
#   quitando las marcas.
mt:
  states: [q0, q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, q11, qf]
  input_alphabet: ["0", "1", "+"]
  tape_alphabet: ["0", "1", "+", C, U, B]
  blank: B
  initial_state: q0
  accept_states: [qf]
  transitions:
    # --- Fase 1: validar la forma x+y --------------------------------------
    # q0: x debe empezar con un bit (con '+' o B no hay transición: rechaza).
    - {state: q0, read: "0", write: "0", move: R, next: q1}
    - {state: q0, read: "1", write: "1", move: R, next: q1}
    # q1: recorre x hasta el '+'. Si llega a B no hubo '+': rechaza.
    - {state: q1, read: "0", write: "0", move: R, next: q1}
    - {state: q1, read: "1", write: "1", move: R, next: q1}
    - {state: q1, read: "+", write: "+", move: R, next: q2}
    # q2: y debe empezar con un bit (rechaza 1+ y 1++1).
    - {state: q2, read: "0", write: "0", move: R, next: q3}
    - {state: q2, read: "1", write: "1", move: R, next: q3}
    # q3: recorre y hasta el blanco. Un segundo '+' no tiene transición.
    - {state: q3, read: "0", write: "0", move: R, next: q3}
    - {state: q3, read: "1", write: "1", move: R, next: q3}
    - {state: q3, read: B, write: B, move: L, next: q4}
    # --- Fase 2: sumar bit por bit ------------------------------------------
    # q4: en el extremo derecho. Borra el último bit de y y lo lleva en el
    # estado (0 → q5, 1 → q6). Si lee '+', y ya se acabó: pasa a limpiar.
    - {state: q4, read: "0", write: B, move: L, next: q5}
    - {state: q4, read: "1", write: B, move: L, next: q6}
    - {state: q4, read: "+", write: B, move: L, next: q10}
    # q5 / q6: llevan 0 / 1 a la izquierda sobre lo que queda de y.
    - {state: q5, read: "0", write: "0", move: L, next: q5}
    - {state: q5, read: "1", write: "1", move: L, next: q5}
    - {state: q5, read: "+", write: "+", move: L, next: q7}
    - {state: q6, read: "0", write: "0", move: L, next: q6}
    - {state: q6, read: "1", write: "1", move: L, next: q6}
    - {state: q6, read: "+", write: "+", move: L, next: q8}
    # q7: suma 0. Pasa las posiciones ya sumadas (C/U) y marca la primera
    # sin marcar; si x se acabó (B), la posición nueva vale 0.
    - {state: q7, read: C, write: C, move: L, next: q7}
    - {state: q7, read: U, write: U, move: L, next: q7}
    - {state: q7, read: "0", write: C, move: R, next: q9}
    - {state: q7, read: "1", write: U, move: R, next: q9}
    - {state: q7, read: B, write: C, move: R, next: q9}
    # q8: suma 1. Igual que q7, pero 1 + 1 = 0 con acarreo (q11).
    - {state: q8, read: C, write: C, move: L, next: q8}
    - {state: q8, read: U, write: U, move: L, next: q8}
    - {state: q8, read: "0", write: U, move: R, next: q9}
    - {state: q8, read: "1", write: C, move: L, next: q11}
    - {state: q8, read: B, write: U, move: R, next: q9}
    # q11: propaga el acarreo sobre posiciones aún no sumadas, sin marcarlas
    # (todavía les falta sumar su bit de y). Si x se acaba, escribe un 1 nuevo.
    - {state: q11, read: "1", write: "0", move: L, next: q11}
    - {state: q11, read: "0", write: "1", move: R, next: q9}
    - {state: q11, read: B, write: "1", move: R, next: q9}
    # q9: regresa al extremo derecho para tomar el siguiente bit de y.
    - {state: q9, read: "0", write: "0", move: R, next: q9}
    - {state: q9, read: "1", write: "1", move: R, next: q9}
    - {state: q9, read: "+", write: "+", move: R, next: q9}
    - {state: q9, read: C, write: C, move: R, next: q9}
    - {state: q9, read: U, write: U, move: R, next: q9}
    - {state: q9, read: B, write: B, move: L, next: q4}
    # --- Fase 3: limpiar ----------------------------------------------------
    # q10: regresa cambiando C → 0, U → 1 y termina sobre el primer símbolo.
    - {state: q10, read: C, write: "0", move: L, next: q10}
    - {state: q10, read: U, write: "1", move: L, next: q10}
    - {state: q10, read: "0", write: "0", move: L, next: q10}
    - {state: q10, read: "1", write: "1", move: L, next: q10}
    - {state: q10, read: B, write: B, move: R, next: qf}
  inputs:
    - "1011+110"   # 11 + 6 = 17   → 10001
    - "111+1"      # 7 + 1 = 8     → 1000
    - "1+1111"     # 1 + 15 = 16   → 10000
    - "1001+1001"  # 9 + 9 = 18    → 10010
